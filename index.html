<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petits plus</title>
<meta name="description" content="Compter les moments qui font du bien.">
<meta name="theme-color" content="#151313">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icone-192.png">
<link rel="stylesheet" href="css/couleurs.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="haut">
    <button id="installer" class="discret" hidden>Installer</button>
  </header>

  <section class="compte">
    <div class="mois-nom" id="mois-nom">&nbsp;</div>
    <div class="chiffre" id="chiffre" aria-hidden="true">0</div>
    <p class="lecture" id="lecture" role="status"></p>
  </section>

  <section class="graphe" aria-hidden="true">
    <div class="colonnes" id="colonnes">
      <div class="mediane" id="mediane" hidden><span id="mediane-valeur"></span></div>
    </div>
    <div class="valeurs" id="valeurs"></div>
    <div class="noms" id="noms"></div>
  </section>

  <p class="souci" id="souci" hidden></p>

  <button class="plus" id="plus" aria-label="Garder un moment">+</button>

  <div class="bandeau" id="bandeau" hidden>
    <span id="bandeau-texte">Gardé</span>
    <span class="bandeau-cibles">
      <button class="lien-bandeau" id="preciser">préciser</button>
      <button class="annuler" id="annuler">Annuler</button>
    </span>
  </div>

  <div class="volet" id="volet" hidden>
    <div class="volet-fond" id="volet-fond"></div>
    <div class="volet-corps" role="dialog" aria-modal="true" aria-label="Le langage de ce moment">
      <div class="langues" id="langues"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
